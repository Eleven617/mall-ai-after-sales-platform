name: mall-ci

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mall-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mall-ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Compile FastAPI sources
        run: python -m compileall -q app
      - name: Collect FastAPI regression suite
        run: python -m pytest --collect-only -q
      - name: Validate v3 release manifest
        run: python scripts/validate_v3_release_manifest.py --json
      - name: Run v3 deterministic release preflight
        run: python scripts/run_v3_release_preflight.py --json
      - name: Run FastAPI regression suite
        run: >-
          python -m pytest -q
          --junitxml=v3-fastapi-junit.xml
      - name: Upload FastAPI deterministic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastapi-regression-evidence
          path: |
            mall-ai-service/v3-fastapi-junit.xml
          if-no-files-found: error

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mall2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - name: Compile affected Java modules
        run: mvn -pl mall-portal,mall-admin -am -DskipTests package
      - name: Run portal collaboration and event tests
        run: >-
          mvn -pl mall-portal -am
          -Dtest=AiCaseHandoffServiceImplTest,AiServiceCaseServiceImplTest,AiServiceCaseOutboxPublisherTest,AiServiceCaseEventReceiverTest,SpringDataWebExposureContractTest
          -DskipTests=false -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Run service-operations tests
        run: >-
          mvn -pl mall-admin -am
          -Dtest=AiServiceOperationsServiceImplTest,AiServiceOperationsControllerTest
          -DskipTests=false -Dsurefire.failIfNoSpecifiedTests=false test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mall-ai-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mall-ai-web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build

  compose-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose contract without starting data services
        env:
          DEEPSEEK_API_KEY: ci-placeholder-not-a-secret
        run: docker compose --env-file .env.example config --quiet

  dependency-and-secret-risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan committed content for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan dependency manifests and lockfiles for known vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          # The Mall Maven reactor contains local SNAPSHOT modules. The
          # isolated scanner container cannot resolve those artifacts, so
          # scan each direct manifest/lockfile explicitly and keep the
          # time-bounded Java 8 exception visible in osv-scanner.toml.
          scan-args: |
            --config=./osv-scanner.toml
            --lockfile=mall-ai-service/requirements.txt
            --lockfile=mall-ai-service/requirements-ci.txt
            --lockfile=mall-ai-service/labs/langgraph_order_exception/requirements.txt
            --lockfile=mall-ai-web/package-lock.json
            --recursive
            mall2
