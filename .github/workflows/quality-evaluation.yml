name: quality-evaluation

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-quality-evaluation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mall-ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mall-ai-web/package-lock.json
      - name: Install AI service dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Compile and collect deterministic runtime sources
        run: python -m compileall -q app && python -m pytest --collect-only -q
      - name: Validate v3 release manifest and deterministic preflight
        run: >-
          python scripts/validate_v3_release_manifest.py --json &&
          python scripts/run_v3_release_preflight.py --json
      - name: Run Build 22 contract_mock trajectory and red-team gate
        run: >-
          python scripts/run_quality_agent_evaluation.py
          > quality-agent-summary.txt
      - name: Run task-aware conversation contract gate
        run: python scripts/evaluate_task_orchestration.py --mode contract_mock
      - name: Run quality and v3 release contract tests
        run: python -m pytest tests/test_quality_evaluation_agent.py tests/test_quality_router.py tests/test_quality_developer_client.py tests/test_release_manifest.py tests/test_release_evaluation.py
      - name: Validate versioned RAG 2.0 contracts
        run: python -m pytest tests/test_rag2_evaluation.py tests/test_policy_query.py tests/test_bm25_retriever.py tests/test_policy_retrieval.py tests/test_cross_encoder_reranker.py tests/test_rag_service.py tests/test_rag_evidence_verifier.py tests/test_chunking_service.py tests/test_embedding_and_vector_store.py tests/test_policy_metadata.py tests/test_chunk_metadata_evaluation.py tests/test_knowledge_contract.py
      - name: Validate RAG chunk and metadata pre-filter contract
        run: python scripts/evaluate_chunk_metadata.py --summary
      - name: Upload safe quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-contract-evidence
          path: |
            mall-ai-service/quality-agent-summary.txt
          if-no-files-found: error
      - name: Build developer quality page
        working-directory: mall-ai-web
        run: npm ci && npm run build
