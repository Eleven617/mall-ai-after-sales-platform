server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${MALL_DB_USERNAME:mall_app}
    password: ${MALL_DB_PASSWORD:mall_app}
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 10
  redis:
    host: redis
    database: 0
    port: 6379
    password:
    timeout: 300ms

# The local Build 19 stack does not exercise legacy file uploads. These values
# keep the optional MinIO controller configurable without blocking admin startup.
minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  bucketName: ${MINIO_BUCKET_NAME:mall}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}

logging:
  level:
    root: info
    com.macro.mall: info

logstash:
  enableInnerLog: false
